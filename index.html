<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수산나 — 아카이브</title>
<meta name="description" content="약을 짓고 책을 읽고 가끔 씁니다.">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EC;
  --accent:#2F5D50;
  --accent-2:#44637F;
  --point:#C2703D;
  --point-ink:#A85B2C;
  --ink:#2B2A26;
  --muted:#6B6A61;
  --surface:#FFFFFF;
  --line:rgba(43,42,38,.14);
  --font-title:"Gowun Batang", serif;
  --font-body:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-caption:"Gowun Dodum","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3rem 1.25rem 2rem;
  text-align:center;
}
.wrap{width:100%;max-width:660px}
.eyebrow{
  font-family:var(--font-caption);
  font-size:.72rem;
  letter-spacing:.22em;
  color:var(--accent-2);
  text-transform:uppercase;
  margin-bottom:1.1rem;
}
h1{
  font-family:var(--font-title);
  font-size:clamp(2.4rem,9vw,3.4rem);
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.25;
  margin-bottom:.6rem;
}
.tagline{
  font-family:var(--font-title);
  font-size:clamp(1rem,3.6vw,1.15rem);
  color:var(--accent);
}
.rule{
  width:46px;height:2px;
  background:var(--point);
  margin:2rem auto 2.25rem;
}
.cards{
  display:flex;
  gap:1rem;
  justify-content:center;
  align-items:stretch;
}
.card{
  flex:1 1 0;
  min-width:0;
  display:block;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.6rem 1.25rem 1.5rem;
  text-decoration:none;
  color:inherit;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(43,42,38,.10);
  border-color:rgba(43,42,38,.22);
  outline:none;
}
.icon{
  width:52px;height:52px;
  border-radius:50%;
  margin:0 auto .95rem;
  display:flex;align-items:center;justify-content:center;
}
.card-insight .icon{background:rgba(47,93,80,.10)}
.card-assignment .icon{background:rgba(68,99,127,.10)}
.card h2{
  font-family:var(--font-title);
  font-size:1.3rem;
  font-weight:700;
  margin-bottom:.45rem;
}
.card-insight h2{color:var(--accent)}
.card-assignment h2{color:var(--accent-2)}
.card p{
  font-family:var(--font-caption);
  font-size:.85rem;
  color:var(--muted);
  line-height:1.65;
}
footer{
  margin-top:3rem;
  font-family:var(--font-caption);
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:.02em;
}
@media (max-width:560px){
  .cards{flex-direction:column}
  .rule{margin:1.6rem auto 1.8rem}
  footer{margin-top:2.25rem}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card:hover,.card:focus-visible{transform:none}
}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">글짓는 약사 수산나</p>
  <h1>수산나</h1>
  <p class="tagline">약을 짓고 책을 읽고 가끔 씁니다</p>
  <div class="rule"></div>

  <nav class="cards">
    <a class="card card-insight" href="insight/">
      <span class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 20c0-6 3-11 9-13"/>
          <path d="M18 5c1 6-2 11-7 11-2 0-3-1-3-3 0-4 5-7 10-8z"/>
        </svg>
      </span>
      <h2>인사이트</h2>
      <p>살롱에서 한 주를 지나며<br>보고 배운 것을 정리한 리포트</p>
    </a>

    <a class="card card-assignment" href="assignment/">
      <span class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#44637F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="12" height="12" rx="2"/>
          <path d="M8 20h10a2 2 0 0 0 2-2V8"/>
        </svg>
      </span>
      <h2>과제</h2>
      <p>살롱 과제로 실제로 만든<br>결과물과 그 방법</p>
    </a>
  </nav>

  <footer>글짓는 약사 수산나 · 디퍼 언브랜딩 살롱 아카이브</footer>
</main>
</body>
</html>
