<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>독서 기록 — 수산나 아카이브</title>
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 팔레트 "이른 아침 약국" — 2026-08-29. 대비값은 README 참조 */
  --bg:#F5F8F7;
  --surface:#FFFFFF;
  --ink:#22312E;
  --muted:#5A6B67;
  --line:#D6E2DF;
  --line-strong:#B6CBC5;
  --shadow:rgba(34,49,46,.13);
  --accent:#0B6E62;          /* 인사이트 — 청록 */
  --accent-2:#A85520;        /* 과제 — 구운 흙빛 */
  --accent-3:#7A3E5E;        /* 약사의 자리 — 자두 */
  --accent-4:#3A5A8C;        /* 독서 기록 — 새벽 남색 */
  --point:#A85520;
  --point-ink:#A85520;
  --tint:rgba(34,49,46,.05);
  --tint-accent:rgba(11,110,98,.09);
  --tint-2:rgba(168,85,32,.09);
  --tint-3:rgba(122,62,94,.10);
  --tint-4:rgba(58,90,140,.10);
  --font-title:"Gowun Batang", serif;
  --font-body:"Nanum Myeongjo", serif;
  --font-caption:"Gowun Dodum", sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:2.25rem 1.25rem 2.5rem;
}
.wrap{width:100%;max-width:860px;margin:0 auto;flex:1}
.back{
  display:inline-block;
  font-family:var(--font-caption);
  font-size:.85rem;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:2.5rem;
  transition:color .18s ease;
}
.back:hover,.back:focus-visible{color:var(--accent-4);outline:none}
.eyebrow{
  font-family:var(--font-caption);
  font-size:.7rem;
  letter-spacing:.22em;
  color:var(--accent-4);
  margin-bottom:.6rem;
}
h1{
  font-family:var(--font-title);
  font-size:clamp(1.9rem,6vw,2.4rem);
  font-weight:700;
  margin-bottom:.6rem;
}
.lead{
  font-family:var(--font-caption);
  font-size:.9rem;
  color:var(--muted);
  max-width:52ch;
  margin-bottom:1.5rem;
}
.grid{
  list-style:none;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:1rem;
}
.grid li.featured{grid-column:1/-1}
.card{
  display:flex;
  flex-direction:column;
  height:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-top:3px solid var(--accent-4);
  border-radius:12px;
  padding:1.25rem 1.3rem 1.35rem;
  text-decoration:none;
  color:inherit;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  box-shadow:0 10px 24px var(--shadow);
  border-color:var(--line-strong);
  border-top-color:var(--accent-4);
  outline:none;
}
.tag{
  display:inline-block;
  align-self:flex-start;
  font-family:var(--font-caption);
  font-size:.7rem;
  letter-spacing:.06em;
  padding:.15rem .55rem;
  border-radius:999px;
  margin-bottom:.6rem;
}
.tag-club{background:var(--tint-4);color:var(--accent-4)}
.tag-solo{background:var(--tint-accent);color:var(--accent)}
.card h2{
  font-family:var(--font-title);
  font-size:1.12rem;
  font-weight:700;
  margin-bottom:.4rem;
}
.card p{font-size:.86rem;color:var(--muted);line-height:1.6}
.empty{
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:140px;
  justify-content:center;
  border:1px dashed var(--line-strong);
  border-radius:12px;
  padding:1.25rem 1.3rem;
  text-decoration:none;
  color:inherit;
  transition:border-color .18s ease, background .18s ease;
}
.empty:hover,.empty:focus-visible{
  border-color:var(--accent-4);
  background:var(--tint-4);
  outline:none;
}
.empty h2{
  font-family:var(--font-title);
  font-size:1rem;
  font-weight:400;
  color:var(--muted);
  margin-bottom:.3rem;
}
.empty p{font-family:var(--font-caption);font-size:.8rem;color:var(--muted)}
footer{
  margin-top:4rem;
  padding-top:1.5rem;
  border-top:1px solid var(--line);
  font-family:var(--font-caption);
  font-size:.75rem;
  color:var(--muted);
  text-align:center;
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card:hover,.card:focus-visible{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 글짓는 약사</a>

  <p class="eyebrow">READING</p>
  <h1>독서 기록</h1>
  <p class="lead">읽은 책에 대해 남긴 독서 노트와 서평. 살롱 밖에서 이어가는 읽기입니다.</p>

  <ul class="grid">

    <!-- 새 독서 기록은 이 위에 <li> 하나씩 쌓습니다. 최신이 맨 위.
         태그는 tag-club(독서모임) 또는 tag-solo(혼자 읽기) 중 하나.
    <li>
      <a class="card" href="260903-존재와무.html">
        <span class="tag tag-club">독서모임</span>
        <h2>여기에 책 제목</h2>
        <p>여기에 한 줄 설명.</p>
      </a>
    </li>
    -->

    <li>
      <a class="empty" href="template.html">
        <h2>첫 독서 기록을 기다리는 자리</h2>
        <p>눌러보면 글 틀이 열립니다 — 복사해서 YYMMDD-책이름.html 로 저장하세요.</p>
      </a>
    </li>

    <li>
      <span class="empty" aria-hidden="true">
        <h2>비어 있음</h2>
        <p>자라는 아카이브입니다.</p>
      </span>
    </li>

  </ul>

  <footer>글짓는 약사 수산나 · 디퍼 언브랜딩 살롱 아카이브</footer>
</div>
</body>
</html>
